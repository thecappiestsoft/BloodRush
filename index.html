ion:"CATCH THE ERYTHROCYTES!",fact:"Erythrocytes contain haemoglobin, which carries oxygen.",learn:"Erythrocytes (red blood cells) are the most numerous formed elements. Mature ones have no nucleus, are shaped like biconcave discs and are packed with haemoglobin, which binds oxygen. They also carry some CO₂."},"leuko-defense":{name:"Runaway bacteria",instruction:{primary:"SEND IN THE LEUKOCYTES!",highschool:"ACTIVATE THE PHAGOCYTES!",technical:"ACTIVATE THE PHAGOCYTES!"},fact:"Leukocytes defend the body and take part in the immune response.",learn:"Leukocytes are white blood cells with a nucleus. Neutrophils and monocytes (macrophages in tissues) engulf microbes (phagocytosis). B and T lymphocytes are responsible for specific immunity, such as making antibodies."},"plug-wound":{name:"Plug the wound",instruction:{primary:"PLUG THE WOUND!",highschool:"STOP THE BLEEDING!",technical:"START HAEMOSTASIS!"},fact:"Thrombocytes take part in haemostasis, including forming a platelet plug.",learn:"Haemostasis is the set of processes that stop bleeding: constriction of the damaged vessel, formation of a platelet plug and blood clotting, in which fibrinogen is converted into insoluble fibrin. Calcium ions are needed, among other things."},"no-embolism":{name:"Stop the blockage",instruction:"STOP THE BLOCKAGE!",fact:"A clot inside a vessel can block blood flow.",learn:"This is an educational abstraction: a healthy vessel carries a suspension of blood cells in plasma. Clotting is needed at the site of an injury, but a clot that breaks off and travels in the blood (an embolus) can block a vessel."},"oxygen-transport":{name:"Oxygen delivery",instruction:"DELIVER THE OXYGEN!",fact:"Erythrocytes pick up oxygen in the lungs and release it in the tissues.",learn:"In the lung capillaries, oxygen diffuses from the alveoli into the blood and binds to haemoglobin. In the tissues oxygen is released and CO₂ enters the blood – mostly as HCO₃⁻ ions in plasma, partly bound to haemoglobin."},"hemo-catch":{name:"Load the haemoglobin",instruction:"LOAD THE HAEMOGLOBIN!",fact:"One haemoglobin molecule can bind up to 4 oxygen molecules.",learn:"Haemoglobin is made of 4 protein chains, each with a haem group containing an iron ion. Carbon monoxide (CO) binds to haemoglobin much more strongly than oxygen, which is why CO poisoning is dangerous."},"pressure-stop":{name:"Blood pressure gauge",instruction:"STOP THE NEEDLE!",fact:"A reading of 120/80 mm Hg means systolic / diastolic pressure.",learn:"Arterial blood pressure is measured in mm Hg. Systolic pressure occurs while the ventricles contract, diastolic while they relax. The values in the game are examples and are not for judging anyone’s health."},"pulse-tap":{name:"Tap the pulse",instruction:"TAP THE HEARTBEAT!",fact:"Pulse is the number of heartbeats per minute felt on an artery.",learn:"The pulse is taken e.g. on the radial artery. You can count beats for 15 s and multiply by 4. An adult’s resting pulse is usually about 60–100 per minute; in trained athletes it can be lower."},"blood-path":{name:"Order the blood path",instruction:"ORDER THE BLOOD PATH!",fact:"Blood flows: right ventricle → lungs → left atrium → left ventricle → body → right atrium.",learn:"Pulmonary circulation carries blood from the right ventricle through the lungs to the left atrium. Systemic circulation carries blood from the left ventricle through the body to the right atrium."},"match-function":{name:"Match part to function",instruction:"MATCH THE PAIRS!",fact:"Every part of the circulatory system has its own job.",learn:"Structure is linked to function: erythrocytes without a nucleus hold more haemoglobin, and the thick wall of the left ventricle lets it pump blood around the whole body."},"odd-one-out":{name:"Odd one out",instruction:"ODD ONE OUT!",fact:"The formed elements of blood are erythrocytes, leukocytes and thrombocytes.",learn:"Grouping ideas helps organise knowledge: formed elements, plasma components, parts of the heart, vessels of the pulmonary and systemic circulation."},"heart-labels":{name:"Label the heart",instruction:"LABEL THE HEART!",fact:"The heart has four chambers: two atria and two ventricles.",learn:"Heart diagrams are usually drawn as seen from the front, so the right side of the heart is on the left of the picture. The venae cavae open into the right atrium, the pulmonary trunk leaves the right ventricle, the pulmonary veins open into the left atrium and the aorta leaves the left ventricle."},"true-false":{name:"True or false?",instruction:"TRUE OR FALSE?",fact:"Careful reading is half the battle!",learn:"Watch out for words like “always”, “never” and “all” – they often hide traps. For example, arteries do not always carry oxygenated blood."},valves:{name:"Set the valves",instruction:"SET THE VALVES!",fact:"Valves keep blood flowing one way through the heart.",learn:"Atrioventricular valves: tricuspid (right) and bicuspid/mitral (left). Semilunar valves: pulmonary and aortic. When the ventricles contract, the semilunar valves open and the atrioventricular valves close; when they relax, the opposite happens."},"quick-quiz":{name:"Quick choice",instruction:"QUICK CHOICE!",fact:"Decide fast – but think!",learn:"Questions come from the task bank – teachers can edit them and add their own in the teacher panel."},"memory-sequence":{name:"Remember the blood cells",instruction:"REMEMBER THE ORDER!",fact:"Erythrocytes and thrombocytes have no nucleus; leukocytes do.",learn:"Recognising formed elements: erythrocyte – red, no nucleus, biconcave; thrombocyte – a small cell fragment; neutrophil – lobed nucleus; lymphocyte – large round nucleus; monocyte – kidney-shaped nucleus; eosinophil – orange granules."},"memory-groups":{name:"Remember the blood groups",instruction:"REMEMBER THE BLOOD GROUPS!",fact:"The ABO and Rh systems are independent of each other.",learn:"The ABO system has groups A, B, AB and O, depending on antigens A and B on the erythrocytes. The Rh factor (antigen D) is determined separately: Rh+ or Rh−."},"vanishing-labels":{name:"Vanishing labels",instruction:"REMEMBER THE HEART DIAGRAM!",fact:"Atria receive blood; ventricles pump it out.",learn:"Atria have thinner walls and receive blood from veins. Ventricles have thicker walls and pump blood into arteries – the left ventricle has the thickest wall."},"find-error":{name:"Find the mistake",instruction:"FIND THE MISTAKE!",fact:"Blood always flows in one direction around the circuit.",learn:"The full path of blood: right atrium → right ventricle → pulmonary trunk → pulmonary arteries → lung capillaries → pulmonary veins → left atrium → left ventricle → aorta → arteries → tissue capillaries → veins → venae cavae → right atrium."},"find-cell":{name:"Find the right cell",instruction:"FIND THE RIGHT CELL!",fact:"The structure of blood cells matches their function.",learn:"The shape of the nucleus helps identify leukocytes in a smear: neutrophil – lobed, lymphocyte – large and round, monocyte – kidney-shaped, eosinophil – two lobes with orange granules."},"spot-change":{name:"What changed?",instruction:"WHAT CHANGED?",fact:"Careful observation of a smear is the basis of lab work.",learn:"In a blood smear, erythrocytes are the most numerous; there are far fewer leukocytes, and platelets are the smallest."},"sort-blood":{name:"Blood sorting",instruction:"SORT THE BLOOD COMPONENTS!",fact:"Blood = plasma (about 55%) + formed elements (about 45%).",learn:"Plasma is the liquid part of blood (about 90% water, plus proteins, mineral salts, glucose and hormones). The formed elements are erythrocytes, leukocytes and thrombocytes."},"artery-vein":{name:"Artery or vein?",instruction:"ARTERY OR VEIN?",fact:"Arteries carry blood away from the heart, veins to it – whatever its oxygen content.",learn:"Arteries: thick, elastic walls, high pressure. Veins: thinner walls, often valves. Capillaries: walls one cell thick, exchange of substances. The pulmonary trunk is an artery with deoxygenated blood; the pulmonary veins are veins with oxygenated blood."},"sort-functions":{name:"Sort the functions",instruction:"SORT THE FUNCTIONS!",fact:"Erythrocytes – gas transport, leukocytes – defence, thrombocytes – haemostasis.",learn:"Erythrocytes mainly carry oxygen (haemoglobin). Leukocytes defend the body. Thrombocytes take part in haemostasis – they form a platelet plug and support clotting."},"gas-exchange":{name:"Gas exchange",instruction:"INTO OR OUT OF THE BLOOD?",fact:"Gases diffuse from where their concentration is higher to where it is lower.",learn:"In the lungs: O₂ moves from the alveoli into the blood, CO₂ from the blood into the alveoli. In the tissues: O₂ moves from the blood into cells, CO₂ from cells into the blood."},"calc-composition":{name:"Calculate blood composition",instruction:"CALCULATE THE BLOOD COMPOSITION!",fact:"Plasma is about 55% of blood volume.",learn:"Haematocrit is the percentage of blood volume taken up by red blood cells. Plasma volume ≈ blood volume × (100% − haematocrit). The data in these tasks are simplified training values."},morphology:{name:"Blood count analysis",instruction:"READ THE BLOOD COUNT PRINTOUT!",fact:"A full blood count describes the number and features of formed elements.",learn:"Abbreviations: RBC – erythrocytes, WBC – leukocytes, PLT – platelets, HGB – haemoglobin, HCT – haematocrit, MCV – mean red cell volume. Results are interpreted by a doctor; the game does not diagnose."},"count-beats":{name:"Count the heartbeats",instruction:"COUNT THE HEARTBEATS!",fact:"Each heartbeat is a contraction of the ventricles.",learn:"Beats per minute can be worked out from a shorter count: beats in 15 s × 4, in 10 s × 6, in 5 s × 12 (the shorter the count, the less accurate)."},donor:{name:"Match the blood group",instruction:{primary:"IDENTIFY THE BLOOD GROUP!",highschool:"CHOOSE THE DONOR!",technical:"CHOOSE THE DONOR!"},fact:"Transfusion compatibility depends on which blood component is given.",learn:"For red cell concentrate, the antigens on the donor’s cells matter: they must not react with the recipient’s antibodies (e.g. a group A recipient has anti-B). For plasma, the antibodies in the donor’s plasma matter. An Rh− recipient should receive Rh− red cells. In practice compatibility tests (crossmatch) are always done."},"build-circulation":{name:"Build the circulatory system",instruction:"BUILD THE CIRCULATORY SYSTEM!",fact:"The human circulatory system is closed and has two circuits.",learn:"Pulmonary circulation is for gas exchange in the lungs. Systemic circulation delivers oxygenated blood to the organs and takes deoxygenated blood away from them."},"connect-vessels":{name:"Connect the vessels",instruction:"FAILURE! CONNECT THE VESSELS!",fact:"The vessels join up into a closed circuit.",learn:"Arteries branch into ever smaller vessels down to capillaries, which join into venules and veins that take blood back to the heart."},"fix-heart":{name:"Fix the heart",instruction:"FIX THE HEART!",fact:"The right side of the heart pumps blood to the lungs, the left side to the whole body.",learn:"The right and left sides of the heart are separated by a septum – oxygenated and deoxygenated blood do not mix."},"arrange-order":{name:"Put them in order",instruction:"PUT THEM IN ORDER!",fact:"Putting things in order reveals how they relate.",learn:"Size: thrombocyte < erythrocyte < leukocytes (the monocyte is the largest). Numbers: erythrocytes > thrombocytes > leukocytes. Pressure falls from the aorta to the venae cavae."},"grand-circulation":{name:"The Great Circulation",instruction:"FINAL: THE GREAT CIRCULATION!",fact:"Every part of the circulatory system works together.",learn:"The final combines the blood path, recognising blood cells, haemostasis and blood group compatibility."}};function Xg(s){let c=s>>>0;return()=>{c=c+1831565813>>>0;let u=c;return u=Math.imul(u^u>>>15,u|1),u^=u+Math.imul(u^u>>>7,u|61),((u^u>>>14)>>>0)/4294967296}}const $g=()=>Math.floor(Math.random()*2**31),bi=(s,c,u)=>M
